# One-off: removes the archived Dragon Character mod's releases from the Releases page. Their git
# tags (v0.1.0 ... v0.2.2) and the archive/dragon-character branch keep the code. Run by hand from the
# Actions tab; this file is deleted again afterwards.
name: Remove the Dragon Character releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the releases, keeping their tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for tag in v0.1.0 v0.1.1 v0.1.2 v0.2.0 v0.2.1 v0.2.2; do
            if gh release view "$tag" > /dev/null 2>&1; then
              gh release delete "$tag" --yes
              echo "deleted the release $tag (the tag stays)"
            else
              echo "no release $tag"
            fi
          done
