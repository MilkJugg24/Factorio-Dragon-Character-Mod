# Publishes a GitHub release of the Unity avatar exporter as a .unitypackage.
#
# Either push a tag exporter-v<version> (e.g. exporter-v0.0.1), or run this workflow by hand from the
# Actions tab ("Run workflow"), which creates that tag from the version in
# unity/Packages/com.milkjugg24.factorio-avatar-exporter/package.json. A pushed tag must match it.
name: Exporter release

on:
  push:
    tags:
      - "exporter-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the release tag
        id: tag
        run: |
          version=$(python3 -c "import json; print(json.load(open('unity/Packages/com.milkjugg24.factorio-avatar-exporter/package.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#exporter-v}" != "$version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
          else
            tag="exporter-v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test the exporter Core
        run: dotnet test unity/dotnet/Core.Tests

      - name: Build the .unitypackage
        run: python3 tools/make_unitypackage.py

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; bump the version in package.json for a new one."
            exit 1
          fi
          package=$(ls build/FactorioAvatarExporter_*.unitypackage)
          cat > notes.md <<NOTES
          Download **$(basename "$package")** below. In Unity 2022.3 (your VRChat project), choose
          **Assets ▸ Import Package ▸ Custom Package...**, pick the file and click **Import**. The exporter is
          installed in \`Assets/FactorioAvatarExporter\`; importing a newer version updates it in place.

          Then select your avatar and choose **Tools ▸ Factorio Avatar Exporter**. See the README in that
          folder for what this version does.
          NOTES
          gh release create "$TAG" "$package" \
            --target "$GITHUB_SHA" \
            --title "Avatar Exporter $TAG" \
            --notes-file notes.md \
            --prerelease
