# Publishes a GitHub release of the Avatar Characters mod with its installable zip.
#
# Runs by itself after CI passes on main: it publishes a release when the version is new and does
# nothing when that version is already released, so bumping the version is all a release takes.
#
# Otherwise either push a tag avatar-characters-v<version> (e.g. avatar-characters-v0.1.0), or run
# this workflow by hand from the Actions tab ("Run workflow"), which creates that tag from the version
# in avatar-characters/info.json. A pushed tag must match that version.
name: Mod release

on:
  push:
    tags:
      - "avatar-characters-v*"
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # after CI, only when it passed on a push to main
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}

      - name: Work out the release tag
        id: tag
        run: |
          version=$(python3 -c "import json; print(json.load(open('avatar-characters/info.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#avatar-characters-v}" != "$version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match info.json version $version"
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
          else
            tag="avatar-characters-v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build mod zip
        run: tools/build_mod.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; bump the version in info.json to publish a new one."
            exit 0
          fi
          zip=$(ls build/avatar-characters_*.zip)
          cat > notes.md <<NOTES
          Download **$(basename "$zip")** below and drop it, still zipped, into your Factorio \`mods\` folder:

          - Windows: \`%APPDATA%\\Factorio\\mods\`
          - Linux: \`~/.factorio/mods\`
          - macOS: \`~/Library/Application Support/factorio/mods\`

          Requires Factorio 2.0; Space Age is optional. On its own the mod changes nothing: add avatar packs
          (mods named \`avatar-pack-<name>\`, made with the Factorio Avatar Exporter for Unity, see the
          **Avatar Exporter** releases) and every player picks their look in the avatar window
          (shortcut bar, or Ctrl + Shift + A). In multiplayer, every player needs the same packs.

          Before removing a pack (or this mod) from a save, an admin runs \`/avatar-revert-all\`; see the
          README in the repository.
          NOTES
          gh release create "$TAG" "$zip" \
            --target "$COMMIT" \
            --title "Avatar Characters ${TAG#avatar-characters-v}" \
            --prerelease \
            --notes-file notes.md
