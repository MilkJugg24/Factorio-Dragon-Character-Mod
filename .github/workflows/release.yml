# Publishes a GitHub release with the installable mod zip.
#
# Runs by itself after CI passes on main: it publishes a release when the version is new and does
# nothing when that version is already released, so bumping the version is all a release takes.
#
# Otherwise either push a version tag (e.g. v0.1.0), or run this workflow by hand from
# the Actions tab ("Run workflow"), which creates the tag v<version> from
# dragon-character/info.json. A pushed tag must match that version.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # after CI, only when it passed on a push to main
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}

      - name: Work out the release tag
        id: tag
        run: |
          version=$(python3 -c "import json; print(json.load(open('dragon-character/info.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match info.json version $version"
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build mod zip
        run: tools/build_mod.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; bump the version in info.json to publish a new one."
            exit 0
          fi
          zip=$(ls build/dragon-character_*.zip)
          cat > notes.md <<NOTES
          Download **$(basename "$zip")** below and drop it, still zipped, into your Factorio \`mods\` folder:

          - Windows: \`%APPDATA%\\Factorio\\mods\`
          - Linux: \`~/.factorio/mods\`
          - macOS: \`~/Library/Application Support/factorio/mods\`

          Requires Factorio 2.0. Space Age is optional (it adds wing-flapping flight with mech armor).
          NOTES
          gh release create "$TAG" "$zip" \
            --target "$COMMIT" \
            --title "Dragon Character $TAG" \
            --notes-file notes.md
