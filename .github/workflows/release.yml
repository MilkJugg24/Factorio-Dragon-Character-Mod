# Publishes a GitHub release with the installable mod zip whenever a version
# tag (e.g. v0.1.0) is pushed. The tag must match "version" in
# dragon-character/info.json.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches info.json version
        run: |
          version=$(python3 -c "import json; print(json.load(open('dragon-character/info.json'))['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match info.json version $version"
            exit 1
          fi

      - name: Build mod zip
        run: tools/build_mod.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls build/dragon-character_*.zip)
          cat > notes.md <<NOTES
          Download **$(basename "$zip")** below and drop it, still zipped, into your Factorio \`mods\` folder:

          - Windows: \`%APPDATA%\\Factorio\\mods\`
          - Linux: \`~/.factorio/mods\`
          - macOS: \`~/Library/Application Support/factorio/mods\`

          Requires Factorio 2.0. Space Age is optional (it adds wing-flapping flight with mech armor).
          NOTES
          gh release create "$GITHUB_REF_NAME" "$zip" \
            --title "Dragon Character $GITHUB_REF_NAME" \
            --notes-file notes.md
