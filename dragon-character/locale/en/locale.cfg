[mod-name]
dragon-character=Dragon Character

[mod-description]
dragon-character=Replaces the engineer with a winged, tailed dragon. Open the customization window from the shortcut bar, the dragon button in the top-left corner or with Ctrl + Shift + D to change your scale color, body shape (male/female) and outfits (hoodie, shorts). Avatar packs add more looks.

[shortcut-name]
dragon-character-customize=Dragon customization

[controls]
dragon-character-toggle-gui=Open dragon customization

[mod-setting-name]
dragon-character-show-top-button=Show the dragon button in the top-left corner

[mod-setting-description]
dragon-character-show-top-button=Adds a button next to the other mod buttons that opens the dragon customization window. The window can also be opened from the shortcut bar or with Ctrl + Shift + D.

