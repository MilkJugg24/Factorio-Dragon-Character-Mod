status-no-character=Your new look will be applied once you have a character again.
status-remote=Your new look will be applied when you return to your character.
status-cutscene=Your new look will be applied after the cutscene.
status-vehicle=Your new look will be applied when you get out of the vehicle.
status-cargo-pod=Your new look will be applied once you have left the cargo pod.
status-flying=Your new look will be applied when you land.
status-crafting=Your new look will be applied once your crafting queue is empty.
status-robots=Your new look will be applied once your personal robots have returned.
status-cursor=Your new look will be applied once your hand is empty.
status-foreign=Your character currently comes from another mod. Your new look will be applied once you are back to a normal character.
status-avatar-missing=The avatar pack "__1__" is not installed, so you are shown as the dragon. Install it again to get that look back.
status-missing=This combination is not available. Please report this to the mod author.
status-failed=Changing your character failed. It will be retried shortly.
command-dragon-help=Opens or closes the dragon customization window.
command-revert-help=Admin only. Turns every character and corpse back into the vanilla prototypes so the mod can be removed safely. With a pack id (/dragon-revert-all <id>), only turns back those using that avatar pack, before removing that pack.
admin-only=Only admins can use this command.
revert-done=Reverted all online players to the default dragon and converted __1__ corpses. Characters still using other dragon variants or avatar packs: __2__ (offline, dead or busy players — run the command again once they are available).
revert-pack-done=Turned everyone using the avatar pack "__1__" back into the dragon and converted __2__ corpses. Characters still using it: __3__ (offline, dead or busy players — run the command again once they are available).
avatar-pack-gone=Dragon Character: the avatar pack "__1__" you chose is no longer installed. You are shown as the dragon until it is installed again.
